function conf(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let n=0;n<26;n++){const e=document.createElement('span');e.className='cf';e.textContent=R(['🎉','⭐','✨','🐧','❄️']);e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}}
function resume(){let v=null;try{v=JSON.parse(localStorage.getItem('p'))}catch(e){}return v&&v.i>1&&v.i<S.length-1?`<button class="btn g" onclick="i=${v.i};pts=${v.pts};draw()">▶ ধাপ ${v.i+1} থেকে চালিয়ে যান</button>`:''}
const mx=X=>X.reduce((m,s)=>m+(s.t=='place'?s.it.length*10:s.t=='lab'?20:s.t=='mcq'?10:0),0);

let S=[],MAX=0,COURSES=[],cur=0,nm_='',U={name:'',c:{}},DB=null,UID=null,tm=0,wp_=0;
const est=X=>Math.round((X.length-2)*1.8),K=k=>COURSES[k].id,to=p=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),2500))]);
function sv(){clearTimeout(tm);tm=setTimeout(async()=>{try{localStorage.setItem('np',JSON.stringify(U))}catch(e){}try{if(DB&&UID)await DB.collection('data/users/'+UID).doc('p').set(JSON.parse(JSON.stringify(U)))}catch(e){}},500)}
async function load(){try{const L=await fetch('courses/catalog.json').then(r=>r.json());COURSES=(await Promise.all(L.map(f=>fetch('courses/'+f).then(r=>r.json())))).map(j=>({...j,s:[{t:'intro'},...j.steps,{t:'cert'}]}))}catch(e){$('app').textContent='কোর্স লোড হয়নি। ইন্টারনেট বা courses ফোল্ডার যাচাই করুন।';return}try{const u=await to(claude.use('user'));UID=u?await u.id():null;DB=UID?await to(claude.use('db')):null}catch(e){}
let d=null;try{if(DB&&UID){const r=await DB.collection('data/users/'+UID).doc('p').get();if(r.exists)d=r.data()}}catch(e){}
if(!d)try{d=JSON.parse(localStorage.getItem('np'))}catch(e){}
if(d&&d.c)U=d;name=U.name||'';home()}
function openC(k){cur=k;S=COURSES[k].s;MAX=mx(S);const p=U.c[K(k)]||{};if(p.i>0&&!p.done){i=p.i;pts=p.pts||0;rs=p.rs||[]}else{i=0;pts=0;rs=[]}st=0;draw()}

function home(){cur=-1;['pt','st','ms','sy'].forEach(k=>$(k).textContent='');$('pb').style.width='0';
if(!U.name){$('app').innerHTML=`<h1>স্বাগতম 👋</h1><p class="mu">ফ্রি ইন্টারেক্টিভ কোর্স। প্রতিটি শেষে সার্টিফিকেট।</p><label for="nm">আপনার নাম (সার্টিফিকেটে বসবে)</label><input id="nm" type="text" placeholder="আপনার নাম" oninput="nm_=this.value.trim();$('sb').disabled=!nm_"><button id="sb" class="btn" disabled onclick="U.name=name=nm_;sv();home()">শুরু করুন</button><p class="mu" style="font-size:13px">🔒 শুধু নাম ও অগ্রগতি সংরক্ষিত হয়। ইমেইল বা অন্য তথ্য নেওয়া হয় না।</p>`;return}
name=U.name;const ds=COURSES.filter((c,k)=>(U.c[K(k)]||{}).done).length;

try{name=localStorage.getItem('n')||''}catch(e){}

 ({intro,cards,place,lab,mcq,cert})[s.t](s)}

function place(s){
 let pl={},sel=null,done=false,ok=0;const ix=s.it.map((_,k)=>k).sort(()=>Math.random()-.5);
 const chip=k=>`<span class="chip ${sel===k?'sel':''} ${done?(pl[k]===s.it[k][1]?'ok':'no'):''}" draggable="${!done}" ondragstart="event.dataTransfer.setData('t',${k})" onclick="event.stopPropagation();pick(${k})">${s.it[k][0]}</span>`;
 window.pick=k=>{if(done)return;if(pl[k]!=null){pl[k]=null;sel=null}else sel=k;r()};
 window.put=z=>{if(done||sel==null)return;if(s.cap&&ix.some(k=>pl[k]===z))return;pl[sel]=z;sel=null;r()};
 window.dr=(e,z)=>{e.preventDefault();sel=+e.dataTransfer.getData('t');put(z)};window.dp=e=>{e.preventDefault();const k=+e.dataTransfer.getData('t');pl[k]=null;sel=null;r()};window.chk=()=>{done=true;ok=ix.filter(k=>pl[k]===s.it[k][1]).length;pts+=ok*10;const all=ok==s.it.length;say(all?R(G):'প্রায় হয়ে গেছে, লাল চিহ্নিতগুলো দেখুন 💪',all?'c':'t');if(all){st++;conf()}else st=0;rs.push({n:s.h.split(': ').pop(),ok:ok/s.it.length>=.75});$('pt').textContent=`স্কোর: ${pts}`;r()};
 function r(){const all=ix.every(k=>pl[k]!=null);
  $('app').innerHTML=head(s)+`<p class="mu">${s.q}</p><div class="pool" ondragover="event.preventDefault()" ondrop="dp(event)">${ix.filter(k=>pl[k]==null).map(chip).join('')||'<span class="mu">সব আইটেম বসানো হয়েছে</span>'}</div>`+s.z.map((z,n)=>`<div class="zone" onclick="put(${n})" ondragover="event.preventDefault()" ondrop="dr(event,${n})"><b>${z}</b>${ix.filter(k=>pl[k]===n).map(chip).join('')}</div>`).join('')+(done?`<div class="fb">${ok}/${s.it.length} সঠিক। লাল চিহ্নিতগুলো আবার ভাবুন।</div>`+nav():`<button class="btn" ${all?'':'disabled'} onclick="chk()">যাচাই করুন</button>`)}
 r()}
function L(h){const c=parseInt(h.slice(1),16);return[c>>16&255,c>>8&255,c&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4}).reduce((a,v,k)=>a+v*[.2126,.7152,.0722][k],0)}
function lab(){let t='#9aa3d6',b='#ffffff',done=false;
 window.up=()=>{t=$('tc').value;b=$('bc').value;const a=L(t),c=L(b),R=(Math.max(a,c)+.05)/(Math.min(a,c)+.05);$('pv').style.cssText=`color:${t};background:${b}`;$('rt').innerHTML=`কনট্রাস্ট রেশিও: <b>${R.toFixed(1)}:1</b> ${R>=4.5?'✅ পড়ার জন্য ভালো':'❌ ৪.৫ এর নিচে, পড়া কঠিন'}`;$('lb').disabled=R<4.5};
 $('app').innerHTML=`<h2>কালার ল্যাব: কনট্রাস্ট</h2><p class="mu">টেক্সট ও ব্যাকগ্রাউন্ডের রঙ বদলান যতক্ষণ না রেশিও ৪.৫ বা তার বেশি হয়। এটি পড়ার সুবিধার সাধারণ মানদণ্ড।</p><div id="pv" class="lab" style="color:${t};background:${b}">৫ দিনে লোগো ডিজাইন</div><div class="row"><label>টেক্সট <input id="tc" type="color" value="${t}" oninput="up()"></label><label>ব্যাকগ্রাউন্ড <input id="bc" type="color" value="${b}" oninput="up()"></label></div><p id="rt"></p><button id="lb" class="btn" disabled onclick="pts+=20;rs.push({n:'কনট্রাস্ট',ok:true});conf();go()">সম্পন্ন (+২০)</button>`;up()}
function mcq(s){$('app').innerHTML=head(s)+`<p>${s.q}</p>`+s.o.map((o,k)=>`<button class="opt" onclick="ans(${k})">${o}</button>`).join('')+`<button id="fi" class="btn g" onclick="fifty()">✂️ ৫০:৫০ (পয়েন্ট অর্ধেক)</button><div id="fb"></div>`;
 let d=false,half=false;window.fifty=()=>{if(d||half)return;half=true;let n=0;document.querySelectorAll('.opt').forEach((b,k)=>{if(k!==s.a&&n<2){b.style.display='none';n++}});$('fi').disabled=true};
window.ans=k=>{if(d)return;d=true;$('fi').style.display='none';const bs=document.querySelectorAll('.opt'),c=k===s.a;bs[s.a].classList.add('ok');if(c){pts+=half?5:10;st++;if(st>1)conf()}else{bs[k].classList.add('no');st=0}rs.push({n:s.h.split(': ').pop(),ok:c});$('pt').textContent=`স্কোর: ${pts}`;say(R(c?G:B),c?'c':'o');$('fb').innerHTML=`<div class="fb">${c?'✅ সঠিক! ':'❌ ঠিক হয়নি। '}${s.w}${st>1?`<br>🔥 ${st} টানা সঠিক!`:''}</div>`+nav()}}
function cert(){const p=pts/MAX>=(COURSES[cur].pass||.7);if(p){const o=U.c[K(cur)]=U.c[K(cur)]||{};o.done=1;o.sc=Math.max(o.sc||0,pts);o.i=0;o.pts=0;sv()}setTimeout(()=>{if(p)conf();say(p?'অভিনন্দন! আপনি কোর্স শেষ করেছেন 🎓':'আরেকবার চেষ্টা করলেই পারবেন, আমি আছি! 💪',p?'c':'o')},60);const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
 $('app').innerHTML=p?`<div class="cert"><div class="lg" style="margin:0 auto 6px"><svg viewBox="0 0 100 100"><g fill="none" stroke="#F2B632" stroke-width="6" stroke-linecap="round"><path d="M72 20A38 38 0 1 0 80 74"/><path d="M62 52Q76 42 82 22"/></g><path d="M32 72V28h8l20 28V28h8v44h-8L40 44v28z" fill="#F2B632"/><path d="M74 14l16-2-6 16z" fill="#F2B632"/></svg></div><b>NUVIA Creatives</b><h1>Certificate of Completion</h1><p>This certifies that</p><div class="nm">${name.replace(/[<>&]/g,'')}</div><p>has completed the course<br><b>Graphics Design for Marketplaces</b><br>${COURSES[cur].lv}</p><p>Score: ${pts}/${MAX} • ${rk(pts/MAX)} • ${d}</p><div class="pg sv" style="margin:8px auto">${PG('c')}</div><small class="mu">Ideas. Design. Build. Grow.</small></div><p class="mu" style="margin-top:14px">আপনার ফলাফল:</p><div class="pool">${rs.map(r=>`<span class="chip ${r.ok?'ok':'no'}">${r.ok?'✅':'🔁'} ${r.n}</span>`).join('')}</div><a class="btn" style="display:inline-block;text-decoration:none" href="https://www.facebook.com/share/1cC2HEqDDu/" target="_blank" rel="noopener">NUVIA Creatives-এর সাথে সংযুক্ত থাকুন</a> ${fl()}<button class="btn" onclick="print()">প্রিন্ট / PDF সেভ</button> <button class="btn g" onclick="pts=0;i=1;draw()">আবার শুরু</button> <button class="btn" onclick="home()">🏠 কোর্স তালিকা</button>`:`<h2>আরেকটু চেষ্টা দরকার</h2><p>স্কোর ${pts}/${MAX}। সার্টিফিকেটের জন্য কমপক্ষে ${Math.round((COURSES[cur].pass||.7)*100)}% লাগবে।</p><button class="btn" onclick="pts=0;i=1;draw()">আবার চেষ্টা করুন</button>`}
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;const b=$('ib');if(b)b.style.display=''});function inst(){if(ip){ip.prompt();ip=null;const b=$('ib');if(b)b.style.display='none'}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
$('app').textContent='লোড হচ্ছে…';load();
</script></body></html>
